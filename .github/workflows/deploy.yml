name: CI / Deploy

# Tests and builds run for every PR and push; pushes to main (or a manual run)
# then deploy to AWS. AWS access uses GitHub's OIDC token exchanged for the
# short-lived EventSyncGitHubDeployRole: no AWS keys are stored in GitHub.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npx ng build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser
          retention-days: 7

  deploy:
    name: Deploy to AWS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The IAM role trusts only this environment; add required reviewers to it
    # in GitHub for a manual approval gate.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write   # needed to request the OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements.txt
      - run: pip install -r infra/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assume AWS deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: event-sync-${{ github.run_id }}
          aws-region: ap-southeast-2

      - name: cdk deploy
        working-directory: infra
        run: npx --yes aws-cdk@2 deploy EventSyncStack --require-approval never --outputs-file cdk-outputs.json

      - name: Summary
        working-directory: infra
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          out = json.load(open("cdk-outputs.json"))["EventSyncStack"]
          print("### Deployed\n")
          print(f"- App: {out['AppUrl']}")
          print(f"- Health: {out['ApiHealthUrl']}")
          EOF
